<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Leaflet - Ville de Québec</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://fancyguitarist.github.io/personalycarte.github.io/Data/VilledeQuebec.geojson"></script>
    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialiser la carte centrée sur Québec
        var map = L.map('map').setView([46.8139, -71.2082], 11); 

        // Ajouter une couche OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Charger le fichier GeoJSON contenant la ville de Québec
        fetch('https://fancyguitarist.github.io/personalycarte.github.io/Data/VilledeQuebec.geojson')
            .then(response => response.json())
            .then(data => {
                var quebecLayer = L.geoJSON(data, {
                    style: {
                        color: "blue",
                        weight: 2,
                        fillOpacity: 0.3
                    }
                }).addTo(map);

                // Ajuster la carte aux limites du polygone
                var bounds = quebecLayer.getBounds();
                map.fitBounds(bounds);

                // Empêcher l'utilisateur de sortir de cette zone
                map.setMaxBounds(bounds);
                map.options.minZoom = map.getZoom(); // Empêche le zoom arrière excessif
            })
            .catch(error => console.error("Erreur de chargement du GeoJSON :", error));
    </script>
</body>
</html>
